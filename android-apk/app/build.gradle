apply plugin: 'com.android.application'
android {
    namespace 'vn.anhoa.ninja'
    compileSdk 34
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId 'vn.anhoa.ninja'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.3.0-android.1'
    }
    sourceSets { main { assets.srcDirs = ['../www'] } }
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            storeFile file('../.local/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'androidx.webkit:webkit:1.9.0' }
tasks.named('preBuild').configure { dependsOn rootProject.tasks.named('prepareGame') }
def debugKey = file('../.local/debug.keystore')
tasks.register('ensureDebugKey', Exec) {
    onlyIf { !debugKey.exists() }
    doFirst { debugKey.parentFile.mkdirs() }
    def suffix = System.getProperty('os.name').toLowerCase().contains('windows') ? '.exe' : ''
    commandLine new File(System.getProperty('java.home'), 'bin/keytool' + suffix),
        '-genkeypair', '-keystore', debugKey, '-storepass', 'android', '-keypass', 'android',
        '-alias', 'androiddebugkey', '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000',
        '-dname', 'CN=Android Debug,O=Android,C=US'
}
tasks.named('preBuild').configure { dependsOn tasks.named('ensureDebugKey') }
